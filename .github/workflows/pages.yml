name: Github Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]    
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
        - uses: oven-sh/setup-bun@v2
        - uses: actions/configure-pages@v3

        - name: Build
          run: |
            bun i --frozen-lockfile
            bun run build
            touch dist/.nojekyll

        - uses: actions/upload-pages-artifact@v3
          with:
            path: dist
    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4